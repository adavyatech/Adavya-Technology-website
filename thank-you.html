<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="icon.png" sizes="30x30">
  <title>Adavya Technology</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #0D2C5C;
      --navy-deep: #081D3F;
      --orange: #F4802A;
      --orange-deep: #DD6812;
      --ink: #182233;
      --ink-soft: #55607A;
      --line: #E4E8F0;
      --surface: #F6F8FB;
      --white: #FFFFFF;
      --radius-lg: 24px;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #f5f8ff 0%, #edf3fb 100%);
      color: var(--ink);
    }

    .card {
      width: min(760px, 100%);
      background: var(--white);
      border-radius: var(--radius-lg);
      box-shadow: 0 24px 70px -28px rgba(13, 44, 92, 0.35);
      border: 1px solid var(--line);
      padding: clamp(28px, 4vw, 52px);
      text-align: center;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 18px;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(244, 128, 42, 0.12);
      color: var(--orange-deep);
      border: 1px solid rgba(244, 128, 42, 0.28);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: 'Sora', sans-serif;
      font-size: clamp(28px, 4vw, 42px);
      line-height: 1.14;
      color: var(--navy-deep);
    }

    p {
      margin: 18px auto 0;
      max-width: 52ch;
      color: var(--ink-soft);
      font-size: 16px;
      line-height: 1.7;
    }

    .actions {
      margin-top: 30px;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 14px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 14px 24px;
      border-radius: 999px;
      font-weight: 600;
      text-decoration: none;
      transition: transform 0.18s ease, background 0.18s ease;
    }

    .btn:hover { transform: translateY(-1px); }

    .btn-primary {
      background: var(--navy);
      color: var(--white);
    }

    .btn-primary:hover { background: var(--navy-deep); }

    .btn-outline {
      border: 1px solid var(--line);
      background: var(--white);
      color: var(--navy);
    }

    .btn-outline:hover { background: var(--surface); }

    .meta {
      margin-top: 24px;
      font-size: 14px;
      color: var(--ink-soft);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">Request received</div>
    <h1>Thanks for reaching out.</h1>
    <p>
      We’ve received your message and our team will get back to you soon with the next steps.
      You’ll be returned to the home page in a moment.
    </p>

    <div class="actions">
      <a href="index.html" class="btn btn-primary">Return Home Now</a>
    </div>

    <div class="meta" id="countdown">Returning to home in 5 seconds...</div>
  </div>

  <script>
    const countdown = document.getElementById('countdown');
    let seconds = 5;

    const timer = setInterval(() => {
      seconds -= 1;
      countdown.textContent = seconds > 0
        ? `Returning to home in ${seconds} second${seconds === 1 ? '' : 's'}...`
        : 'Returning now...';

      if (seconds <= 0) {
        clearInterval(timer);
        window.location.href = 'index.html';
      }
    }, 1000);
  </script>
</body>
</html>
